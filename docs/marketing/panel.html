<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SocialEdge panel (mock)</title>
<link rel="stylesheet" href="../../extension/popup.css"/>
</head>
<body>
<div class="dash" id="dash">

  <!-- ── Left column (narrow: full page, wide: left panel) ──── -->
  <div class="dash-left">

  <!-- ── Header ───────────────────────────────────────────────── -->
  <header class="header">
    <button type="button" class="brand" id="brand-btn" title="About SocialEdge">
      <svg class="brand-icon" viewBox="0 0 28 28" fill="none">
        <line x1="4" y1="22" x2="14" y2="11" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        <line x1="14" y1="11" x2="24" y2="3"  stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
        <circle cx="4"  cy="22" r="3" fill="#34D399" opacity=".45"/>
        <circle cx="14" cy="11" r="3" fill="#34D399" opacity=".72"/>
        <circle cx="24" cy="3"  r="3" fill="#34D399"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">SocialEdge</span>
        <span class="brand-sub">LinkedIn Selling Score</span>
      </div>
    </button>
    <div class="header-right">
      <div class="header-meta">
        <button class="header-tips-btn" id="header-tips-btn">
          <svg width="12" height="12" viewBox="0 0 13 13" fill="none">
            <circle cx="6.5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M5 8.5v1a1.5 1.5 0 0 0 3 0v-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="6.5" y1="3" x2="6.5" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          Profile Tips
        </button>
        <span class="last-updated" id="last-updated">—</span>
      </div>
    </div>
  </header>

  <!-- ── Hero score ────────────────────────────────────────────── -->
  <section class="hero">
    <div class="hero-score-row">
      <span class="hero-number" id="overall">—</span>
      <div class="hero-trend" id="overall-trend"></div>
      <button class="quest-trigger" id="quest-trigger" title="Today's Tasks">
        <span class="quest-trigger-dot" id="quest-trigger-dot"></span>
        <span class="quest-trigger-label">Daily Tasks</span>
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
          <path d="M8 1c0 2.5-2 4-2 6a3.5 3.5 0 0 0 3 3.46c-.56-.44-.92-1.12-.92-1.96 0-1.4 1.92-2.5 1.92-4.5 0 0 2 2 2 5a5 5 0 1 1-9-3C3 3.5 5.5 1.5 8 1z"
            fill="url(#flame-grad)"/>
          <defs>
            <linearGradient id="flame-grad" x1="8" y1="1" x2="8" y2="14" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FBBF24"/><stop offset="1" stop-color="#F97316"/>
            </linearGradient>
          </defs>
        </svg>
      </button>
    </div>
    <div class="hero-caption">Overall Social Selling Score <span class="hero-max">/ 100</span></div>
    <div class="hero-bar-track">
      <div class="hero-bar-fill" id="overall-bar"></div>
    </div>
  </section>

  <!-- ── Pillars 2×2 ──────────────────────────────────────────── -->
  <section class="pillars-wrap">
    <div class="pillars-grid">

      <button type="button" class="pillar" data-key="prof_brand" aria-label="Professional Brand details">
        <div class="pillar-top">
          <span class="pillar-label">Professional<br>Brand</span>
          <span class="pillar-score" id="val-pb">—</span>
        </div>
        <div class="pillar-bottom">
          <div class="pillar-track"><div class="pillar-fill" id="bar-pb"></div></div>
          <span class="pillar-trend" id="trend-pb"></span>
        </div>
      </button>

      <button type="button" class="pillar" data-key="find_right_people" aria-label="Find Right People details">
        <div class="pillar-top">
          <span class="pillar-label">Find Right<br>People</span>
          <span class="pillar-score" id="val-frp">—</span>
        </div>
        <div class="pillar-bottom">
          <div class="pillar-track"><div class="pillar-fill" id="bar-frp"></div></div>
          <span class="pillar-trend" id="trend-frp"></span>
        </div>
      </button>

      <button type="button" class="pillar" data-key="insight_engagement" aria-label="Insight Engagement details">
        <div class="pillar-top">
          <span class="pillar-label">Insight<br>Engagement</span>
          <span class="pillar-score" id="val-ie">—</span>
        </div>
        <div class="pillar-bottom">
          <div class="pillar-track"><div class="pillar-fill" id="bar-ie"></div></div>
          <span class="pillar-trend" id="trend-ie"></span>
        </div>
      </button>

      <button type="button" class="pillar" data-key="relationship" aria-label="Strong Relationships details">
        <div class="pillar-top">
          <span class="pillar-label">Strong<br>Relationships</span>
          <span class="pillar-score" id="val-rs">—</span>
        </div>
        <div class="pillar-bottom">
          <div class="pillar-track"><div class="pillar-fill" id="bar-rs"></div></div>
          <span class="pillar-trend" id="trend-rs"></span>
        </div>
      </button>

    </div>

  </section>

  <!-- ── Benchmarks ────────────────────────────────────────────── -->
  <section class="benchmarks">

    <div class="bench-row">
      <span class="bench-type">Industry</span>
      <div class="bench-info">
        <div class="bench-name" id="bench-ind-name">—</div>
        <div class="bench-stats">
          <span class="bench-rank" id="bench-ind-top">—</span>
          <span class="bench-trend" id="bench-ind-trend"></span>
          <span class="bench-ssi"  id="bench-ind-ssi">—</span>
        </div>
      </div>
    </div>

    <div class="bench-divider"></div>

    <div class="bench-row">
      <span class="bench-type">Network</span>
      <div class="bench-info">
        <div class="bench-stats">
          <span class="bench-rank" id="bench-net-top">—</span>
          <span class="bench-trend" id="bench-net-trend"></span>
          <span class="bench-ssi"  id="bench-net-ssi">—</span>
        </div>
      </div>
    </div>

  </section>

  <!-- ── Actions ───────────────────────────────────────────────── -->
  <section class="actions">
    <button id="btn-refresh" class="btn-primary">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M11 6.5A4.5 4.5 0 1 1 6.5 2" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round"/>
        <path d="M6.5 2l1.8-1.8M6.5 2l1.8 1.8" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Refresh Score
    </button>
    <button id="btn-analytics" class="btn-ghost">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <rect x="1" y="7" width="3" height="5" rx="1" fill="currentColor" opacity=".5"/>
        <rect x="5" y="4" width="3" height="8" rx="1" fill="currentColor" opacity=".75"/>
        <rect x="9" y="1" width="3" height="11" rx="1" fill="currentColor"/>
      </svg>
      Analytics
    </button>
    <button id="btn-jobs" class="btn-ghost">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <rect x="1" y="4" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M4.5 4V3a2 2 0 0 1 4 0v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="1" y1="7.5" x2="12" y2="7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      Jobs
    </button>
  </section>

  <div id="status-bar" class="status-bar hidden"></div>

  <!-- ── History trigger button ──────────────────────────────────── -->
  <button class="history-trigger" id="btn-history">
    <span class="history-trigger-left">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7 4.5V7l2 1.5" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Score History
    </span>
    <div class="history-trigger-right">
      <span class="history-count" id="history-count">0 entries</span>
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M3 5l4.5 4.5L12 5" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </button>

  </div><!-- /.dash-left -->
</div><!-- /.dash -->

<script>
// Mock renderer — mirrors extension/popup.js scoring/trend logic exactly,
// fed with a fabricated example account. Not connected to any real data.
function scoreColor(v, max) {
  if (v == null) return "#46465A";
  var pct = v / max;
  if (pct >= 0.72) return "#34D399";
  if (pct >= 0.48) return "#60A5FA";
  if (pct >= 0.28) return "#FBBF24";
  return "#F87171";
}
function trend(cur, prev) {
  if (cur == null || prev == null) return null;
  var d = cur - prev;
  if (Math.abs(d) < 0.05) return { dir: "flat", label: "—" };
  return { dir: d > 0 ? "up" : "down", label: (d > 0 ? "+" : "") + d.toFixed(1) };
}
function trendPct(cur, prev) {
  if (cur == null || prev == null) return null;
  var d = cur - prev;
  if (Math.abs(d) < 0.5) return null;
  return { dir: d < 0 ? "up" : "down", label: Math.abs(Math.round(d)) + "%" };
}
function rankClass(rank) {
  if (rank == null) return "";
  if (rank <= 10) return "rank-green";
  if (rank <= 25) return "rank-blue";
  if (rank <= 50) return "rank-amber";
  return "rank-red";
}
function applyTrend(el, t, cls) {
  cls = cls || "pillar-trend";
  if (!t || t.dir === "flat") { el.textContent = ""; el.className = cls + " flat"; return; }
  el.textContent = (t.dir === "up" ? "↑ " : "↓ ") + t.label;
  el.className = cls + " " + t.dir;
}
var $ = function (id) { return document.getElementById(id); };

var current = {
  date: "2026-08-15",
  parsed: {
    overall: 55.0,
    prof_brand: 19.0,
    find_right_people: 9.5,
    insight_engagement: 14.0,
    relationship: 12.5,
    industry: { name: "Data Infrastructure and Analytics", top: 38, ssi: 51.2 },
    network: { top: 44, ssi: 49.6 }
  }
};
var previous = {
  parsed: {
    overall: 53.6,
    prof_brand: 18.4,
    find_right_people: 9.8,
    insight_engagement: 14.0,
    relationship: 12.3,
    industry: { top: 40 },
    network: { top: 44 }
  }
};

(function render(cur, prev) {
  var p = cur.parsed, pv = prev.parsed;

  $("overall").textContent = p.overall.toFixed(1);
  $("overall").style.color = scoreColor(p.overall, 100);
  $("overall-bar").style.width = (p.overall / 100 * 100) + "%";
  $("overall-bar").style.background = scoreColor(p.overall, 100);
  applyTrend($("overall-trend"), trend(p.overall, pv.overall), "hero-trend");

  $("last-updated").textContent = "Updated " + cur.date;
  $("history-count").textContent = "182 entries";

  [
    ["prof_brand", "val-pb", "bar-pb", "trend-pb"],
    ["find_right_people", "val-frp", "bar-frp", "trend-frp"],
    ["insight_engagement", "val-ie", "bar-ie", "trend-ie"],
    ["relationship", "val-rs", "bar-rs", "trend-rs"]
  ].forEach(function (row) {
    var key = row[0], valId = row[1], barId = row[2], trendId = row[3];
    var val = p[key];
    var color = scoreColor(val, 25);
    $(valId).textContent = val.toFixed(1);
    $(valId).style.color = color;
    $(barId).style.width = (val / 25 * 100) + "%";
    $(barId).style.background = color;
    applyTrend($(trendId), trend(val, pv[key]));
  });

  $("bench-ind-name").textContent = p.industry.name;
  $("bench-ind-ssi").textContent = p.industry.ssi.toFixed(1) + " SSI";
  var indEl = $("bench-ind-top");
  indEl.textContent = "Top " + p.industry.top + "%";
  indEl.className = "bench-rank " + rankClass(p.industry.top);
  applyTrend($("bench-ind-trend"), trendPct(p.industry.top, pv.industry.top), "bench-trend");

  $("bench-net-ssi").textContent = p.network.ssi.toFixed(1) + " SSI";
  var netEl = $("bench-net-top");
  netEl.textContent = "Top " + p.network.top + "%";
  netEl.className = "bench-rank " + rankClass(p.network.top);
  applyTrend($("bench-net-trend"), trendPct(p.network.top, pv.network.top), "bench-trend");
})(current, previous);
</script>
</body>
</html>
